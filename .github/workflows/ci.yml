name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q
        env:
          PYTHONPATH: src
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          PYTHONPATH=src python -m forecast_guard forecast --horizon 14 | grep '"beats_baseline": true'
      - run: PYTHONPATH=src python -m forecast_guard budget --budget 1500 | grep alert_level
      - run: PYTHONPATH=src python -m forecast_guard generate | head -3
